<!DOCTYPE html>
<html lang="en">
    <head>
        <title>ROCK^PAPER^SCISSORS</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
	<div class="container">
		<h1>Play Rock, Paper, Scissors</h1>
		<div class="options">
			<button id="rock" class="option">Rock</button>
			<button id="paper" class="option">Paper</button>
			<button id="scissors" class="option">Scissors</button>
		</div>
		<div class="results">
			<p class="user-pick"><strong>You chose:</strong> </p>
			<p class="computer-pick"><strong>Computer chose:</strong> </p>
			<p class="result"><strong>Result->|</strong> </p>
		</div>
	</div>
        <script src="script.js"></script>
    </body>
</html>
